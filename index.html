<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Estadísticas | Senshi-Kan</title>
<style>
  :root{
    --fondo:#0d0d0f; --panel:#16161a; --borde:#26262c; --texto:#ececf0; --suave:#9a9aa6;
    --acento:#c8102e; --acento2:#e8b04a;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--fondo); color:var(--texto); font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif; min-height:100vh; }
  header{ padding:28px 20px 8px; max-width:1100px; margin:0 auto; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  h1{ font-size:1.5rem; letter-spacing:.14em; text-transform:uppercase; font-weight:600; }
  h1 span{ color:var(--acento); }
  .sub{ color:var(--suave); font-size:.85rem; margin-top:4px; }
  button{ font:inherit; cursor:pointer; border:1px solid var(--borde); background:var(--panel); color:var(--texto); padding:9px 16px; border-radius:8px; }
  button.primario{ background:var(--acento); border-color:var(--acento); font-weight:600; }
  button:disabled{ opacity:.5; cursor:default; }
  .oculto{ display:none !important; }

  #acceso{ max-width:380px; margin:12vh auto 0; padding:28px; background:var(--panel); border:1px solid var(--borde); border-radius:14px; text-align:center; }
  #acceso h2{ font-weight:600; letter-spacing:.1em; text-transform:uppercase; font-size:1rem; margin-bottom:6px; }
  #acceso p{ color:var(--suave); font-size:.85rem; margin-bottom:18px; }
  #acceso input{ width:100%; padding:12px; margin-bottom:12px; background:var(--fondo); border:1px solid var(--borde); border-radius:8px; color:var(--texto); font-size:1rem; text-align:center; }
  #acceso button{ width:100%; }
  #msgAcceso{ color:#ff6b7d; font-size:.85rem; margin-top:12px; min-height:1.2em; }

  main{ max-width:1100px; margin:0 auto; padding:16px 20px 60px; display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:16px; }
  .tarjeta{ background:var(--panel); border:1px solid var(--borde); border-radius:14px; padding:20px; }
  .tarjeta.ancha{ grid-column:1 / -1; }
  .tarjeta h3{ font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:var(--suave); font-weight:600; margin-bottom:14px; }
  .grande{ font-size:2.1rem; font-weight:700; line-height:1.1; }
  .acento{ color:var(--acento2); }
  .nota{ color:var(--suave); font-size:.8rem; margin-top:8px; }
  .persona{ display:flex; gap:14px; align-items:center; padding:10px 0; }
  .persona + .persona{ border-top:1px solid var(--borde); }
  .foto{ width:76px; height:76px; border-radius:50%; background:#222229; border:2px solid var(--acento); object-fit:cover; flex:none; display:flex; align-items:center; justify-content:center; color:var(--suave); font-weight:600; font-size:1.3rem; overflow:hidden; }
  .foto.chica{ width:0; height:0; border:0; display:none; }
  .persona .nombre{ font-weight:600; font-size:1.05rem; }
  .persona .dato{ color:var(--suave); font-size:.9rem; margin-top:3px; }
  .barra{ display:flex; gap:20px; margin-top:12px; flex-wrap:wrap; }
  .barra div{ font-size:.9rem; color:var(--suave); }
  .barra b{ display:block; color:var(--texto); font-size:1.3rem; }
  table{ width:100%; border-collapse:collapse; font-size:.92rem; }
  th{ text-align:left; color:var(--suave); font-weight:600; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; padding:8px 10px; border-bottom:1px solid var(--borde); }
  td{ padding:11px 10px; border-bottom:1px solid var(--borde); vertical-align:top; }
  td small{ display:block; color:var(--suave); font-size:.78rem; margin-top:2px; }
  .tabla-scroll{ overflow-x:auto; }
  .error{ color:#ff6b7d; font-size:.9rem; }
  .dona-caja{ display:flex; align-items:center; gap:18px; margin-top:16px; padding-top:16px; border-top:1px solid var(--borde); flex-wrap:wrap; }
  .dona{ width:132px; height:132px; flex:none; }
  .dona .centro{ fill:var(--texto); font-size:21px; font-weight:700; text-anchor:middle; }
  .dona .centro2{ fill:var(--suave); font-size:7.5px; text-anchor:middle; letter-spacing:.08em; text-transform:uppercase; }
  .leyenda div{ display:flex; align-items:center; gap:8px; font-size:.9rem; margin:5px 0; }
  .leyenda i{ width:12px; height:12px; border-radius:3px; display:inline-block; }
  .grafica{ display:flex; align-items:flex-end; gap:10px; height:210px; margin-top:18px; overflow-x:auto; padding-bottom:2px; }
  .col{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; flex:1; min-width:40px; }
  .col .val{ font-size:.8rem; margin-bottom:4px; }
  .col .bar{ width:100%; max-width:46px; background:var(--acento); border-radius:4px 4px 0 0; min-height:2px; }
  .col .anio{ font-size:.75rem; color:var(--suave); margin-top:6px; }
  .total{ margin-top:14px; padding-top:12px; border-top:1px solid var(--borde); font-size:1rem; }
  .total b{ color:var(--acento2); font-size:1.3rem; }
  .btn-huella{ margin-top:10px; }
  .foto.mini{ width:46px; height:46px; font-size:.9rem; border-width:2px; }
  .subt{ color:var(--suave); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; margin:2px 0 4px; }
  .subt + .persona, .subt + .barra{ margin-top:0; }
  .seccion + .seccion{ margin-top:16px; padding-top:14px; border-top:1px solid var(--borde); }
  .col .bar.amarillo, .relleno{ background:#f5c518; }
  .pestanas{ display:flex; gap:8px; margin-bottom:14px; }
  .pestana{ background:#1e1e24; color:var(--suave); border:1px solid var(--borde); border-radius:8px; padding:7px 14px; font-size:.85rem; cursor:pointer; font-family:inherit; }
  .pestana.activa{ background:#f5c518; color:#111; border-color:#f5c518; font-weight:600; }
  .hfila{ display:flex; align-items:center; gap:10px; margin:7px 0; }
  .hfila .anio{ width:46px; font-size:.82rem; color:var(--suave); }
  .hfila .pista{ flex:1; height:20px; background:#1e1e24; border-radius:4px; overflow:hidden; }
  .hfila .relleno{ height:100%; border-radius:4px; min-width:2px; }
  .hfila .val{ width:48px; text-align:right; font-size:.85rem; }
  .grafica.compacta{ gap:4px; overflow-x:visible; }
  .grafica.compacta .col{ min-width:0; }
  .grafica.compacta .bar{ max-width:26px; }
  .grafica.compacta .val{ font-size:.72rem; }
  th.num, td.num{ text-align:right; white-space:nowrap; }
  td.pos{ color:#3ecf6e; font-weight:600; }
  td.neg{ color:#ff4d5e; font-weight:600; }
  .hfila .anio.largo{ width:100px; }
  .hfila .val.dinero{ width:112px; }
  .rk-grupo + .rk-grupo{ margin-top:6px; border-top:1px solid var(--borde); }
  .rk-num{ color:var(--acento2); font-weight:700; font-size:1.4rem; text-align:center; margin:12px 0 6px; }
  .rk-fila{ display:flex; justify-content:center; gap:12px; margin:8px 0; }
  .rk-item{ display:flex; flex-direction:column; align-items:center; text-align:center; min-width:0; }
  .rk-fila.c1 .rk-item{ width:50%; }
  .rk-fila.c2 .rk-item{ width:calc(50% - 6px); }
  .rk-fila.c4 .rk-item{ width:calc(25% - 9px); }
  .rk-nombre{ margin-top:6px; font-weight:600; font-size:.95rem; overflow-wrap:anywhere; }
  .rk-nombre.chico{ font-size:.8rem; font-weight:500; }
  .dona .centro.sm{ font-size:13px; }
  #carga{ position:fixed; inset:0; z-index:50; background:rgba(13,13,15,.94); display:flex; align-items:center; justify-content:center; }
  #carga.oculto{ display:none; }
  .carga-caja{ width:min(340px, 86vw); text-align:center; }
  .carga-titulo{ color:var(--suave); font-size:.85rem; letter-spacing:.12em; text-transform:uppercase; }
  .carga-pista{ height:12px; background:#222229; border-radius:6px; overflow:hidden; margin:14px 0 8px; }
  #cargaBarra{ height:100%; width:0; background:#f5c518; border-radius:6px; transition:width .25s ease; }
  #cargaPct{ font-weight:700; font-size:1.1rem; }
  #estado{ text-align:center; color:var(--suave); padding:40px 20px; grid-column:1 / -1; }
</style>
</head>
<body>

<div id="carga" class="oculto" role="status" aria-live="polite">
  <div class="carga-caja">
    <div class="carga-titulo">Cargando estadísticas…</div>
    <div class="carga-pista"><div id="cargaBarra"></div></div>
    <div id="cargaPct">0%</div>
  </div>
</div>

<header id="encabezado" class="oculto">
  <div>
    <h1>Senshi<span>-</span>Kan · Estadísticas</h1>
    <div class="sub" id="generado"></div>
  </div>
  <div style="display:flex; gap:8px;">
    <button id="btnHuellaCfg" class="oculto"></button>
    <button id="btnActualizar">Actualizar</button>
    <button id="btnSalir">Salir</button>
  </div>
</header>

<section id="acceso">
  <h2>Acceso de administrador</h2>
  <p>Ingrese su token para ver las estadísticas.</p>
  <input type="password" id="token" placeholder="Token" autocomplete="off">
  <button class="primario" id="btnEntrar">Entrar</button>
  <button id="btnHuella" class="btn-huella oculto">🖐 Entrar con huella</button>
  <div id="msgAcceso"></div>
</section>

<main id="contenido" class="oculto"></main>

<script>
/* ============================================================
   CONFIGURACIÓN: pegue aquí la URL de su Apps Script
   (la misma que usa el portal de retos, termina en /exec)
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbwX5w8iiwkJVbGtpz-5f20U9jue2MC0vouE3blkHXo9CIMqg9bvCZrAYE8WKxH4gXGWzg/exec";

/* ============================================================
   TARJETAS. Para una estadística nueva, agregue un elemento aquí
   con la misma clave que registró en STATS_REGISTRO_ del script.
   ============================================================ */
const TARJETAS = [
  { clave:"ingresosPortal",       titulo:"Alumno con más ingresos al portal de retos", dibujar:tIngresos },
  { clave:"horarioPortal",        titulo:"Horario con más ingresos al portal",         dibujar:tHorario },
  { clave:"diaPortal",            titulo:"INGRESOS AL PORTAL POR DÍA",          dibujar:tDia },
  { clave:"asistencias",          titulo:"Alumno con más asistencias",                 dibujar:tAsistencias },
  { clave:"destacados",           titulo:"Exámenes destacados",                    dibujar:tDestacados },
  { clave:"asistenciasPerfectas", titulo:"Más asistencias perfectas",                  dibujar:tPerfectas },
  { clave:"examenes",            titulo:"Exámenes aplicados y evaluaciones",           dibujar:tExamenes, ancha:true },
  { clave:"pagos",                titulo:"Pagos por año (por alumno)",                 dibujar:tPagos, ancha:true },
  { clave:"finanzas",            titulo:"FINANZAS",                                   dibujar:tFinanzas, ancha:true },
  { clave:"indiceGrupos",       titulo:"Índice de asistencia por grupo",              dibujar:tGrupos, ancha:true }
];

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dinero = n => "$" + Number(n).toLocaleString("es-MX", { minimumFractionDigits:2, maximumFractionDigits:2 });
const veces = (n, uno, varios) => n + " " + (n === 1 ? uno : varios);
function hora12(h){ const x = h % 12 || 12; return x + ":00 " + (h < 12 ? "am" : "pm"); }
function rangoHora(h){ return hora12(h) + " – " + hora12((h + 1) % 24); }
function iniciales(n){ return String(n).split(/\s+/).filter(Boolean).slice(0,2).map(p => p[0]).join("").toUpperCase(); }
function unir(lista){ return lista.length < 2 ? (lista[0] || "") : lista.slice(0,-1).join(", ") + " y " + lista[lista.length-1]; }

function persona(a, detalleHTML, conFoto, chica){
  const foto = conFoto
    ? `<div class="foto${chica ? " mini" : ""}" data-foto="${esc(a.id)}">${esc(iniciales(a.nombre))}</div>` : "";
  return `<div class="persona">${foto}<div><div class="nombre">${esc(a.nombre)}</div>
          <div class="dato">${detalleHTML}</div></div></div>`;
}
function empate(n){ return n > 1 ? `<div class="nota">Empate entre ${n} alumnos.</div>` : ""; }

/* ---------- dibujo de cada tarjeta ---------- */
function tIngresos(d){
  if(!d.alumnos.length) return `<div class="nota">Sin registros.</div>`;
  const g = d.global;
  return d.alumnos.map(a => persona(a, `<b class="acento">${a.ingresos}</b> ingresos al portal`, true)
    + `<div class="barra"><div><b>${a.pctQR}%</b>por QR</div><div><b>${a.pctCURP}%</b>por CURP</div></div>`).join("")
    + empate(d.alumnos.length)
    + `<div class="nota">Los porcentajes de arriba son del alumno; la gráfica muestra los ingresos de todos los alumnos.</div>`
    + dona(g);
}
function dona(g){
  const R = 46, C = 2 * Math.PI * R;
  const otros = Math.max(0, Math.round((100 - g.pctQR - g.pctCURP) * 10) / 10);
  const partes = [
    { pct:g.pctQR,   color:"#d4152f", texto:"Por QR" },
    { pct:g.pctCURP, color:"#f5c518", texto:"Por CURP" }
  ];
  if(otros >= 0.1) partes.push({ pct:otros, color:"#3a3a44", texto:"Sin método registrado" });
  let acumulado = 0;
  const arcos = g.total > 0 ? partes.map(p => {
    const largo = C * p.pct / 100;
    const el = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${p.color}" stroke-width="16"
      stroke-dasharray="${largo} ${C - largo}" stroke-dashoffset="${-acumulado}" transform="rotate(-90 60 60)"/>`;
    acumulado += largo;
    return el;
  }).join("") : `<circle cx="60" cy="60" r="${R}" fill="none" stroke="#3a3a44" stroke-width="16"/>`;
  const leyenda = partes.map(p => `<div><i style="background:${p.color}"></i>${p.texto}: <b>${p.pct}%</b></div>`).join("");
  return `<div class="dona-caja">
    <svg class="dona" viewBox="0 0 120 120" role="img" aria-label="Ingresos por QR y CURP">
      ${arcos}
      <text class="centro" x="60" y="62">${g.total}</text>
      <text class="centro2" x="60" y="75">ingresos</text>
    </svg>
    <div class="leyenda">${leyenda}</div></div>`;
}
function tExamenes(d){
  const maxV = Math.max(1, ...d.porAnio.map(x => x.cantidad));
  const filas = d.porAnio.map(x => `<div class="hfila"><span class="anio">${x.anio}</span>
      <div class="pista"><div class="relleno" style="width:${(x.cantidad / maxV * 100).toFixed(1)}%"></div></div>
      <span class="val">${x.cantidad}</span></div>`).join("");
  return `<div class="barra">
      <div><b>${d.aplicados}</b>exámenes aplicados</div>
      <div><b>${d.evaluaciones}</b>registros de evaluación de alumnos</div></div>
    <div class="nota" style="margin:16px 0 8px">Evaluaciones de alumnos por año</div>
    ${d.porAnio.length ? filas : `<div class="nota">Sin registros.</div>`}
    <div class="total">Total: <b>${d.evaluaciones}</b> evaluaciones${d.sinFecha ? ` <span class="nota">(${d.sinFecha} sin fecha válida, no incluidas en las barras)</span>` : ""}</div>
    <div class="nota">Exámenes aplicados: registros del catálogo con fecha de hoy o anterior; no se cuentan los programados.</div>`;
}
function grupoPestana(btn, n){
  const caja = btn.closest(".tarjeta");
  caja.querySelectorAll(".pestana").forEach((b, k) => b.classList.toggle("activa", k === n));
  caja.querySelectorAll(".panel-pestana").forEach((p, k) => p.style.display = k === n ? "" : "none");
}
function tGrupos(d){
  const bloque = (m, k) => {
    const filas = m.grupos.map(g => `<div style="margin:10px 0">
        <div class="hfila" style="margin:0 0 3px"><span class="anio largo">${esc(g.horario)}${g.ganador ? " ★" : ""}</span>
          <div class="pista"><div class="relleno" style="width:${g.indice === null ? 0 : Math.min(100, g.indice)}%"></div></div>
          <span class="val">${g.indice === null ? "—" : g.indice.toFixed(1) + "%"}</span></div>
        <div class="nota" style="margin:0 0 0 110px">${esc(g.nombre)} · ${g.alumnos} alumnos activos · ${g.clases} clases · ${g.asistencias} asistencias</div></div>`).join("");
    return `<div class="panel-pestana"${k ? ` style="display:none"` : ""}>
      <div class="subt">${esc(m.nombre)}</div>
      ${m.grupos.length ? filas : `<div class="nota">Sin grupos registrados.</div>`}</div>`;
  };
  const botones = d.meses.map((m, k) => `<button type="button" class="pestana${k ? "" : " activa"}" onclick="grupoPestana(this,${k})">${esc(m.etiqueta)}</button>`).join("");
  return `<div class="pestanas">${botones}</div>` + d.meses.map(bloque).join("") +
    `<div class="nota">Índice = asistencias ÷ (alumnos activos del grupo × clases impartidas). ★ = mayor índice. Una clase cuenta como impartida si algún alumno activo del grupo registró asistencia ese día.</div>`;
}
// Paleta de colores de la tarjeta FINANZAS
const C_ROJO = "#d4152f", C_AMARILLO = "#f5c518", C_VERDE = "#2fb457", C_AZUL = "#2f6fed",
      C_CELESTE = "#5cd0f5", C_MORADO = "#a855f7", C_GRIS = "#6b6b78";
const COLOR_METODO = { "Transferencia":C_AZUL, "Efectivo":C_VERDE, "Tarjeta":C_ROJO, "Portal":C_CELESTE, "Otro":C_GRIS };
const COLOR_GASTO  = { "Comisiones Portal":C_CELESTE, "Inventario":C_AMARILLO, "Publicidad":C_ROJO, "Senpai":C_MORADO, "Otros":C_GRIS };
// Color fijo por categoría de pago (clave: nombre sin acentos, en minúsculas)
const COLOR_CONCEPTO = {
  "mensualidad":C_ROJO, "examen":C_AMARILLO, "inscripcion":C_VERDE, "uniforme":C_AZUL,
  "equipo":C_CELESTE, "producto":C_MORADO,
  "visita":"#fb923c",      // naranja
  "merch":"#ec4899",       // rosa
  "libro":"#b8e23a"        // lima
};
const COLOR_CONCEPTO_EXTRA = ["#14b8a6", "#f472b6", "#94a3b8", "#d97706"];   // categorías nuevas que aún no tienen color
const sinAcentos = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "");
const dineroCorto = n => "$" + Number(n).toLocaleString("es-MX", { maximumFractionDigits: 0 });

// Gráfica circular por monto: items = [{nombre, monto, color}]
function donaMonto(items, etiqueta){
  const total = items.reduce((t, x) => t + x.monto, 0);
  if(!items.length) return `<div class="nota">Sin registros.</div>`;
  const partes = items.map(x => ({ valor: x.monto, color: x.color,
    texto: `${x.nombre}: ${(x.monto / total * 100).toFixed(1)}% · ${dinero(x.monto)}` }));
  return donaGen(partes, total, etiqueta, dineroCorto(total));
}

// Gráfica circular genérica: partes = [{valor, color, texto}]
function donaGen(partes, total, etiqueta, centro){
  const R = 46, C = 2 * Math.PI * R;
  let acumulado = 0;
  const arcos = total > 0 ? partes.filter(p => p.valor > 0).map(p => {
    const largo = C * p.valor / total;
    const el = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${p.color}" stroke-width="16"
      stroke-dasharray="${largo} ${C - largo}" stroke-dashoffset="${-acumulado}" transform="rotate(-90 60 60)"/>`;
    acumulado += largo;
    return el;
  }).join("") : `<circle cx="60" cy="60" r="${R}" fill="none" stroke="#3a3a44" stroke-width="16"/>`;
  const leyenda = partes.map(p => `<div><i style="background:${p.color}"></i>${esc(p.texto)}</div>`).join("");
  return `<div class="dona-caja">
    <svg class="dona" viewBox="0 0 120 120" role="img" aria-label="${esc(etiqueta)}">
      ${arcos}
      <text class="centro${centro !== undefined ? " sm" : ""}" x="60" y="62">${centro !== undefined ? esc(centro) : total}</text>
      <text class="centro2" x="60" y="75">${esc(etiqueta)}</text>
    </svg>
    <div class="leyenda">${leyenda}</div></div>`;
}

function itemsConceptos(lista){
  // "Playera/Hoodie" (y variantes) se muestra como "Merch"; las categorías iguales se suman
  const unidas = {};
  lista.forEach(x => {
    const t = sinAcentos(x.nombre);
    const nombre = (t.indexOf("playera") !== -1 || t.indexOf("hoodie") !== -1 || t === "merch") ? "Merch" : x.nombre;
    const clave = sinAcentos(nombre);
    if(!unidas[clave]) unidas[clave] = { nombre: nombre, monto: 0 };
    unidas[clave].monto += x.monto;
  });
  let extra = 0;
  return Object.keys(unidas).map(k => unidas[k])
    .sort((a, b) => b.monto - a.monto)
    .map(x => ({ nombre: x.nombre, monto: Math.round(x.monto * 100) / 100,
                 color: COLOR_CONCEPTO[sinAcentos(x.nombre)] || COLOR_CONCEPTO_EXTRA[extra++ % COLOR_CONCEPTO_EXTRA.length] }));
}
function tFinanzas(d){
  const tablas = d.anios.length ? d.anios.map(y => `<div class="seccion"><div class="subt">${y.anio}</div>
      <div class="tabla-scroll"><table>
        <thead><tr><th>Mes</th><th class="num">Ingreso</th><th class="num">Gasto</th><th class="num">%</th></tr></thead>
        <tbody>${y.meses.map(m => `<tr><td>${m.mes}</td><td class="num">${dinero(m.ingreso)}</td>
          <td class="num">${dinero(m.gasto)}</td>
          <td class="num ${m.pct > 0 ? "pos" : m.pct < 0 ? "neg" : ""}">${m.pct > 0 ? "+" : ""}${m.pct}%</td></tr>`).join("")}</tbody>
      </table></div></div>`).join("")
    : `<div class="nota">Sin registros.</div>`;

  const ms = d.metodos.filter(m => m.operaciones > 0);
  const circular = donaGen(
    d.metodos.map(m => ({ valor: m.operaciones, color: COLOR_METODO[m.nombre] || "#6b6b78",
                          texto: `${m.nombre}: ${m.pct}% (${veces(m.operaciones, "operación", "operaciones")})` })),
    d.operaciones, "operaciones");
  const maxM = Math.max(1, ...ms.map(m => m.monto));
  const barras = ms.map(m => `<div class="hfila"><span class="anio largo">${esc(m.nombre)}</span>
      <div class="pista"><div class="relleno" style="width:${(m.monto / maxM * 100).toFixed(1)}%;background:${COLOR_METODO[m.nombre] || "#6b6b78"}"></div></div>
      <span class="val dinero">${dinero(m.monto)}</span></div>`).join("");

  return tablas
    + `<div class="seccion"><div class="subt">Operaciones por método de pago</div>${circular}</div>
       <div class="seccion"><div class="subt">Dinero recibido por método de pago</div>${barras || `<div class="nota">Sin registros.</div>`}</div>
       <div class="seccion"><div class="subt">Pagos recibidos por categoría</div>${donaMonto(itemsConceptos(d.conceptos || []), "recibido")}</div>
       <div class="seccion"><div class="subt">Gastos por categoría</div>${donaMonto((d.gastosCat || []).map(g => ({ nombre: g.nombre, monto: g.monto, color: COLOR_GASTO[g.nombre] || C_GRIS })), "gastado")}</div>
       <div class="nota">% = (ingreso − gasto) ÷ ingreso. Verde: el ingreso supera al gasto; rojo: el gasto supera al ingreso. No se consideran pagos de $0 ni cancelados.${d.aviso ? " Aviso: " + esc(d.aviso) : ""}</div>`;
}
function tHorario(d){
  if(!d.horas.length) return `<div class="nota">Sin registros.</div>`;
  return `<div class="grande">${d.horas.map(rangoHora).join("<br>")}</div>
          <div class="nota">${veces(d.ingresos, "ingreso", "ingresos")} ${d.horas.length > 1 ? "en cada uno de estos periodos" : "en ese periodo"}.</div>`;
}
function tDia(d){
  if(!d.porDia || !d.total) return `<div class="nota">Sin registros.</div>`;
  const letras = { "Domingo":"D", "Lunes":"L", "Martes":"M", "Miércoles":"M", "Jueves":"J", "Viernes":"V", "Sábado":"S" };
  const maxV = Math.max(1, ...d.porDia.map(x => x.cantidad));
  const barras = d.porDia.map(x => `<div class="col" title="${esc(x.dia)}"><span class="val">${x.cantidad}</span>
      <div class="bar amarillo" style="height:${Math.round(x.cantidad / maxV * 140)}px"></div>
      <span class="anio">${letras[x.dia] || ""}</span></div>`).join("");
  return `<div class="grafica compacta">${barras}</div>
    <div class="total">Total: <b>${d.total}</b> ingresos</div>`;
}
function bloqueAsistencias(titulo, datos){
  const lista = datos.alumnos || [];
  const chica = lista.length > 1;                       // con empate, fotos más pequeñas
  const cuerpo = lista.length
    ? lista.map(a => persona(a, `<b class="acento">${datos.asistencias}</b> asistencias`, true, chica)).join("") + empate(lista.length)
    : `<div class="nota">Sin asistencias registradas.</div>`;
  return `<div class="seccion"><div class="subt">${esc(titulo)}</div>${cuerpo}</div>`;
}
function tAsistencias(d){
  return bloqueAsistencias("En total", d)
       + (d.mes ? bloqueAsistencias("En el mes actual · " + d.mes.nombre, d.mes) : "");
}
function listaConFoto(d, unidad){
  if(!d.alumnos.length) return `<div class="nota">Aún no hay registros.</div>`;
  return d.alumnos.map(a => persona(a, `<b class="acento">${d.total}</b> ${unidad}`, true)).join("") + empate(d.alumnos.length);
}
// Nombre sin apellidos: se ignoran las últimas dos palabras (4 palabras -> 2 nombres; 3 -> 1)
function nombreCorto(nombre){
  const p = String(nombre || "").trim().split(/\s+/).filter(Boolean);
  if(p.length <= 2) return p[0] || "";
  return p.slice(0, p.length - 2).join(" ");
}
function rkItem(a, chica){
  return `<div class="rk-item"><div class="foto${chica ? " mini" : ""}" data-foto="${esc(a.id)}">${esc(iniciales(a.nombre))}</div>
          <div class="rk-nombre${chica ? " chico" : ""}">${esc(nombreCorto(a.nombre))}</div></div>`;
}
function rkFila(items, clase, chica){
  return `<div class="rk-fila ${clase}">${items.map(a => rkItem(a, chica)).join("")}</div>`;
}
function tDestacados(d){
  const r = d.ranking || [];
  if(!r.length) return `<div class="nota">Aún no hay registros.</div>`;

  // Grupos por número de exámenes destacados, de mayor a menor (dentro de cada grupo, orden alfabético)
  const grupos = [];
  r.forEach(a => {
    let g = grupos[grupos.length - 1];
    if(!g || g.total !== a.total){ g = { total: a.total, alumnos: [] }; grupos.push(g); }
    g.alumnos.push(a);
  });

  return grupos.map((g, i) => {
    let filas = "";
    if(i === 0){                                   // primer lugar: 2 columnas, fotos grandes
      let lista = g.alumnos.slice();
      if(lista.length % 2 === 1) filas += rkFila([lista.shift()], "c1", false);   // si son impares, el primero va solo y centrado
      for(let k = 0; k < lista.length; k += 2) filas += rkFila(lista.slice(k, k + 2), "c2", false);
    } else {                                       // demás lugares: 4 columnas, fotos chicas
      for(let k = 0; k < g.alumnos.length; k += 4) filas += rkFila(g.alumnos.slice(k, k + 4), "c4", true);
    }
    return `<div class="rk-grupo"><div class="rk-num">${g.total}</div>${filas}</div>`;
  }).join("");
}
function tPerfectas(d){  return listaConFoto(d, d.total === 1 ? "asistencia perfecta" : "asistencias perfectas"); }

function tPagos(d){
  if(!d.anios.length) return `<div class="nota">Sin pagos registrados.</div>`;
  const nombres = l => l.map(a => esc(a.nombre)).join(", ");
  const filas = d.anios.map(y => `<tr>
      <td><b>${y.anio}</b><small>${y.alumnosConPago} alumnos con pago</small></td>
      <td>${dinero(y.max.monto)}<small>${nombres(y.max.alumnos)}</small></td>
      <td>${dinero(y.min.monto)}<small>${nombres(y.min.alumnos)}</small></td>
      <td>${dinero(y.promedio)}</td>
      <td>${esc(unir(y.mesTop.meses))}<small>${dinero(y.mesTop.monto)} recibidos</small></td></tr>`).join("");
  return `<div class="tabla-scroll"><table>
      <thead><tr><th>Año</th><th>Máx.</th><th>Mín.</th><th>Prom.</th><th>Mes con más ingresos</th></tr></thead>
      <tbody>${filas}</tbody></table></div>
      <div class="nota">Se suman todos los conceptos por alumno en el año (1 de enero al 31 de diciembre). No se consideran pagos de $0 ni cancelados. El promedio es entre los alumnos que pagaron en ese año.</div>`;
}

/* ---------- huella digital (WebAuthn) ----------
   La huella se verifica en el teléfono; si es correcta, se usa el token
   guardado en ese mismo teléfono. Requiere HTTPS (GitHub Pages lo cumple). */
const BIO_KEY = "statsBio";
const aB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const deB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const bioSoportada = () => !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
function bioLeer(){ try{ return JSON.parse(localStorage.getItem(BIO_KEY) || "null"); }catch(e){ return null; } }

function bioRefrescarBotones(){
  const hay = bioSoportada() && !!bioLeer();
  $("btnHuella").classList.toggle("oculto", !hay);
  const cfg = $("btnHuellaCfg");
  cfg.classList.toggle("oculto", !bioSoportada());
  cfg.textContent = bioLeer() ? "Quitar huella" : "Activar huella";
}

async function bioActivar(){
  const token = sessionStorage.getItem("statsToken");
  if(!token) return;
  try{
    const cred = await navigator.credentials.create({ publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: "Senshi-Kan Estadísticas" },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: "administrador", displayName: "Administrador" },
      pubKeyCredParams: [{ type:"public-key", alg:-7 }, { type:"public-key", alg:-257 }],
      authenticatorSelection: { authenticatorAttachment:"platform", userVerification:"required", residentKey:"discouraged" },
      timeout: 60000
    }});
    localStorage.setItem(BIO_KEY, JSON.stringify({ id: aB64(cred.rawId), token }));
    alert("Huella activada en este teléfono.");
  }catch(e){
    alert("No se pudo activar la huella. Verifique que el teléfono tenga huella o bloqueo de pantalla configurado y que esté abriendo la página en Chrome o Safari.");
  }
  bioRefrescarBotones();
}

async function bioEntrar(){
  const b = bioLeer();
  if(!b) return;
  try{
    await navigator.credentials.get({ publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type:"public-key", id: deB64(b.id), transports:["internal"] }],
      userVerification: "required",
      timeout: 60000
    }});
  }catch(e){
    $("msgAcceso").textContent = "No se pudo verificar la huella.";
    return;
  }
  cargar(b.token, true);
}

/* ---------- barra de carga ----------
   El servidor responde de una sola vez, así que el avance mientras espera es
   estimado (sube hasta 90 %); al recibir los datos pasa a 95 % y al dibujar a 100 %. */
let cargaTimer = null, cargaPct = 0;
function cargaPonerPct(p){
  cargaPct = Math.max(0, Math.min(100, p));
  $("cargaBarra").style.width = cargaPct + "%";
  $("cargaPct").textContent = Math.round(cargaPct) + "%";
}
function cargaIniciar(){
  clearInterval(cargaTimer);
  cargaPonerPct(0);
  $("carga").classList.remove("oculto");
  cargaTimer = setInterval(() => { if(cargaPct < 90) cargaPonerPct(Math.min(90, cargaPct + (90 - cargaPct) * 0.06 + 0.3)); }, 150);
}
function cargaDetener(){
  clearInterval(cargaTimer);
  $("carga").classList.add("oculto");
}
async function cargaCompletar(){
  clearInterval(cargaTimer);
  cargaPonerPct(100);
  await new Promise(r => setTimeout(r, 400));     // se alcanza a ver el 100 %
}

/* ---------- comunicación con el servidor ---------- */
async function pedir(token){
  const r = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },   // evita la verificación previa CORS
    body: JSON.stringify({ accion: "estadisticas", token })
  });
  return r.json();
}

async function cargarFotos(){
  const cajas = Array.from(document.querySelectorAll("[data-foto]"));
  const cache = {};
  const pedirFoto = id => cache[id] || (cache[id] = fetch(API_URL + "?accion=fotoAlumno&id=" + encodeURIComponent(id))
                                          .then(r => r.json()).catch(() => ({ success:false })));
  let siguiente = 0;
  async function trabajador(){                 // 4 fotos a la vez
    while(siguiente < cajas.length){
      const caja = cajas[siguiente++];
      const r = await pedirFoto(caja.dataset.foto);
      if(r && r.success && r.foto){
        const img = document.createElement("img");
        img.className = caja.className; img.alt = "";
        img.referrerPolicy = "no-referrer";
        img.src = r.foto;
        img.onerror = () => img.replaceWith(caja);       // si no carga, se queda con las iniciales
        caja.replaceWith(img);
      }
    }
  }
  await Promise.all([trabajador(), trabajador(), trabajador(), trabajador()]);
}

function pintar(resp){
  $("generado").textContent = "Actualizado: " + resp.generado;
  $("contenido").innerHTML = TARJETAS.map(t => {
    let cuerpo;
    if(resp.errores && resp.errores[t.clave]) cuerpo = `<div class="error">No se pudo calcular: ${esc(resp.errores[t.clave])}</div>`;
    else if(!resp.modulos[t.clave]) cuerpo = `<div class="nota">Sin datos.</div>`;
    else cuerpo = t.dibujar(resp.modulos[t.clave]);
    return `<section class="tarjeta${t.ancha ? " ancha" : ""}"><h3>${esc(t.titulo)}</h3>${cuerpo}</section>`;
  }).join("");
  cargarFotos();
}

async function cargar(token, desdeLogin){
  $("btnEntrar").disabled = true; $("btnActualizar").disabled = true;
  $("msgAcceso").textContent = "";
  cargaIniciar();
  if(!desdeLogin){ $("contenido").innerHTML = `<div id="estado">Calculando estadísticas…</div>`; }
  try{
    if(API_URL.indexOf("PEGUE_AQUI") === 0) throw new Error("Falta configurar API_URL en la página.");
    const resp = await pedir(token);
    if(!resp.success){
      if(resp.codigo === "NO_AUTORIZADO"){
        sessionStorage.removeItem("statsToken");
        mostrarLogin("Token no válido o acceso bloqueado temporalmente.");
      } else {
        if(desdeLogin) mostrarLogin("Error: " + (resp.error || "desconocido"));
        else $("contenido").innerHTML = `<div id="estado" class="error">Error: ${esc(resp.error || "desconocido")}</div>`;
      }
      return;
    }
    sessionStorage.setItem("statsToken", token);
    const bio = bioLeer();
    if(bio && bio.token !== token){ bio.token = token; localStorage.setItem(BIO_KEY, JSON.stringify(bio)); }
    bioRefrescarBotones();
    $("acceso").classList.add("oculto");
    $("encabezado").classList.remove("oculto");
    $("contenido").classList.remove("oculto");
    cargaPonerPct(95);
    pintar(resp);
    await cargaCompletar();
  }catch(e){
    if(desdeLogin) mostrarLogin("No se pudo conectar: " + e.message);
    else $("contenido").innerHTML = `<div id="estado" class="error">No se pudo conectar: ${esc(e.message)}</div>`;
  }finally{
    cargaDetener();
    $("btnEntrar").disabled = false; $("btnActualizar").disabled = false;
  }
}

function mostrarLogin(msg){
  $("encabezado").classList.add("oculto");
  $("contenido").classList.add("oculto");
  $("acceso").classList.remove("oculto");
  $("msgAcceso").textContent = msg || "";
  $("token").value = "";
  bioRefrescarBotones();
}

$("btnEntrar").onclick = () => { const t = $("token").value.trim(); if(t) cargar(t, true); };
$("token").addEventListener("keydown", e => { if(e.key === "Enter") $("btnEntrar").click(); });
$("btnActualizar").onclick = () => cargar(sessionStorage.getItem("statsToken") || "", false);
$("btnHuella").onclick = bioEntrar;
$("btnHuellaCfg").onclick = () => {
  if(bioLeer()){ localStorage.removeItem(BIO_KEY); bioRefrescarBotones(); alert("Huella desactivada en este teléfono."); }
  else bioActivar();
};
$("btnSalir").onclick = () => { sessionStorage.removeItem("statsToken"); mostrarLogin(""); };

(function iniciar(){
  bioRefrescarBotones();
  const t = sessionStorage.getItem("statsToken");
  if(t) cargar(t, true);
})();
</script>
